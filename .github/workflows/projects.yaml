name: Sync projects and deploy

on:
  push:
    branches: [main]
  schedule:
    # UTC, away from the busiest minute at the start of the hour.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize catalogue writes and deployments. Never cancel an active deployment.
# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    name: Sync and check catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Queued runs always start from the current main, including bot commits.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Synchronize public projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_projects.py

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check filters and pagination
        run: node --test tests/test_pagination.cjs

      - name: Run site and synchronizer tests
        run: python3 -m unittest discover -v tests

      - name: Check Pages configuration
        uses: actions/configure-pages@v6

      - name: Commit catalogue changes if needed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- index.html
            git commit -m 'Update public project catalogue'
            # A concurrent user push fails safely; never force-push or overwrite it.
            git push origin HEAD:main
          fi

      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css script.js _site/
          cp -R assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicit deployment is necessary: a GITHUB_TOKEN push cannot trigger Pages.
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v5
