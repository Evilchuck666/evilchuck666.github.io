name: Sync projects and deploy

on:
  push:
    branches: [main]
  schedule:
    # UTC, away from the busiest minute at the start of the hour.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize catalogue writes and deployments. Never cancel an active deployment.
# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.filter.outputs.site }}
      sync: ${{ steps.filter.outputs.sync }}
      checks: ${{ steps.filter.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "site": {
                "include": [
                  "index.html",
                  "styles.css",
                  "script.js",
                  "assets/**",
                  ".nojekyll",
                  ".github/workflows/projects.yaml"
                ],
                "exclude": []
              },
              "sync": {
                "include": [
                  "projects.json",
                  "scripts/sync_projects.py",
                  ".github/workflows/projects.yaml"
                ],
                "exclude": []
              },
              "checks": {
                "include": [
                  "index.html",
                  "styles.css",
                  "script.js",
                  "assets/**",
                  "projects.json",
                  "scripts/sync_projects.py",
                  "tests/**",
                  ".github/workflows/projects.yaml"
                ],
                "exclude": [
                  "tests/**.md"
                ]
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  sync:
    needs: [changes]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.site == 'true' || needs.changes.outputs.sync == 'true' || needs.changes.outputs.checks == 'true')
    name: Sync and check catalogue
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Queued runs always start from the current main, including bot commits.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Synchronize public projects
        if: needs.changes.outputs.sync == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_projects.py

      - name: Decide whether validation and deployment are needed
        id: plan
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE_CHANGED: ${{ needs.changes.outputs.site }}
          CHECKS_CHANGED: ${{ needs.changes.outputs.checks }}
        run: |
          import os
          import subprocess

          changed = subprocess.run(['git', 'diff', '--quiet', '--', 'index.html']).returncode
          if changed not in (0, 1):
              raise SystemExit('Cannot inspect synchronized catalogue')
          event = os.environ['EVENT_NAME']
          deploy = bool(changed) or event == 'workflow_dispatch' or (
              event == 'push' and os.environ['SITE_CHANGED'] == 'true'
          )
          checks = deploy or (event == 'push' and os.environ['CHECKS_CHANGED'] == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'catalogue={str(bool(changed)).lower()}', file=output)
              print(f'deploy={str(deploy).lower()}', file=output)
              print(f'checks={str(checks).lower()}', file=output)

      - name: Check JavaScript syntax
        if: steps.plan.outputs.checks == 'true'
        run: node --check script.js

      - name: Check filters and pagination
        if: steps.plan.outputs.checks == 'true'
        run: node --test tests/test_pagination.cjs

      - name: Run site and synchronizer tests
        if: steps.plan.outputs.checks == 'true'
        run: python3 -m unittest discover -v tests

      - name: Check Pages configuration
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Commit catalogue changes if needed
        if: steps.plan.outputs.catalogue == 'true'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- index.html
            git commit -m 'Update public project catalogue'
            # A concurrent user push fails safely; never force-push or overwrite it.
            git push origin HEAD:main
          fi

      - name: Prepare public files
        if: steps.plan.outputs.deploy == 'true'
        run: |
          mkdir _site
          cp index.html styles.css script.js .nojekyll _site/
          cp -R assets _site/assets

      - name: Upload Pages artifact
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: [sync]
    if: needs.sync.outputs.deploy == 'true'
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicit deployment is necessary: a GITHUB_TOKEN push cannot trigger Pages.
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v5

  result:
    name: CI result
    if: always()
    needs: [changes, sync, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
